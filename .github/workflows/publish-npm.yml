name: Release and publish

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  release:
    name: Release and publish to npm + GitHub Packages
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      id-token: write
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
          cache: "npm"

      - name: Require version tag on current master HEAD
        shell: bash
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          VERSION="${TAG_NAME#v}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"

          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid tag format: $TAG_NAME. Expected vX.Y.Z"
            exit 1
          fi

          if [[ "$PACKAGE_VERSION" != "$VERSION" ]]; then
            echo "::error::Tag version $TAG_NAME does not match package.json version $PACKAGE_VERSION"
            exit 1
          fi

          git fetch origin master --depth=1
          MASTER_SHA="$(git rev-parse origin/master)"
          TAG_SHA="$(git rev-parse HEAD)"

          if [[ "$MASTER_SHA" != "$TAG_SHA" ]]; then
            echo "::error::Tag $TAG_NAME must point to the current master HEAD before publishing."
            echo "master: $MASTER_SHA"
            echo "tag:    $TAG_SHA"
            exit 1
          fi

          if [[ -n "$(git status --porcelain)" ]]; then
            echo "::error::Working tree is not clean. Commit or stash changes before release."
            git status --short
            exit 1
          fi

      - name: Resolve release version and notes file
        id: release
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          NOTE_FILE=".github/release-notes/RELEASE_NOTES_v${VERSION}.md"

          if [ ! -f "$NOTE_FILE" ]; then
            echo "::error::Missing release notes file: $NOTE_FILE"
            exit 1
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "note_file=${NOTE_FILE}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Validate release notes file
        run: npm run release:check

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public --registry=https://registry.npmjs.org

      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm config set //npm.pkg.github.com/:_authToken "$NODE_AUTH_TOKEN"
          npm publish --provenance --access public --registry=https://npm.pkg.github.com --@striae-org:registry=https://npm.pkg.github.com

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.release.outputs.version }}
          name: v${{ steps.release.outputs.version }}
          body_path: ${{ steps.release.outputs.note_file }}
          draft: false
          prerelease: false
          generate_release_notes: false
